name: Build NeoQN Fix Pack
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project.zip
        run: "if [ -f project.zip ]; then unzip -o -q project.zip -d .; fi; test -f settings.gradle.kts"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Build
        run: "gradle :fixpack:assembleRelease --stacktrace --no-daemon"
      - name: Collect files
        run: "mkdir -p out && cp fixpack/build/outputs/apk/release/*.apk out/NeoQN_FixPack.apk && cp fixpack/src/main/assets/plugin.json out/NeoQN_FixPack.json"
      - uses: actions/upload-artifact@v4
        with: {name: NeoQN_FixPack, path: out/}
      - uses: softprops/action-gh-release@v2
        with: {tag_name: "build-${{ github.run_number }}", files: "out/NeoQN_FixPack.apk\nout/NeoQN_FixPack.json"}
